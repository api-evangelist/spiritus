description: Spiritus Technologies is a climate-tech company building low-cost direct air capture (DAC)
  technology that removes carbon dioxide from the atmosphere. Its core carbon-dioxide-removal system and
  its Orchard Power product (pairing DAC with waste heat for net-zero power) target dramatically lower
  energy use and capital cost than existing DAC. Backed by Khosla Ventures, Aramco Ventures, and Mitsubishi,
  with carbon-removal customers including Shopify, Stripe, and Frontier. Based in White Rock, New Mexico.
  This is a physical carbon-removal hardware company and does not currently publish a public API,
  SDK, or developer platform.
